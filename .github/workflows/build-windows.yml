name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/gui
      - "codex/**"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[gui,dev]" pyinstaller

      - name: Run tests
        run: python -m pytest

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name RFID-Scanner `
            --collect-all openpyxl `
            windows_launcher.py

      - name: Prepare portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/data | Out-Null
          New-Item -ItemType Directory -Force package/tables | Out-Null
          Copy-Item dist/RFID-Scanner.exe package/RFID-Scanner.exe
          Copy-Item WINDOWS-README.txt package/README.txt
          Set-Content package/data/PLACE_DATABASE_HERE.txt `
            "The application creates attendance.db here."
          Set-Content package/tables/PLACE_SUBJECT_FOLDERS_HERE.txt `
            "Put subject folders with .xlsx group lists here."

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: RFID-Scanner-Windows
          path: package/
          if-no-files-found: error
          retention-days: 30
