name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/gui
      - "codex/**"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[gui,dev]"

      - name: Run tests
        run: python -m pytest

      # Тот же скрипт, что и при локальной сборке, — чтобы exe из CI
      # и собранный руками не расходились.
      - name: Build executables
        shell: cmd
        env:
          BUILD_PY: python
        run: build-exe.cmd

      # exe обязан работать с data\ и tables\ рядом с собой, а в чужой
      # папке — спросить папку, а не завести пустую базу. Окно без экрана
      # (offscreen): смотрим, что процесс жив и какие файлы он создал.
      - name: Smoke-test RFID-Scanner.exe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = (Resolve-Path dist\RFID-Scanner.exe).Path
          # Запустить на 15 с. Вернуть $null, если ещё работает, иначе код выхода.
          function Run-For([string]$folder) {
            Copy-Item $exe $folder
            $p = Start-Process (Join-Path $folder "RFID-Scanner.exe") -PassThru
            Start-Sleep 15
            if (-not $p.HasExited) {
              taskkill /F /T /PID $p.Id | Out-Null
              return $null
            }
            return $p.ExitCode
          }

          # Своя папка: список группы рядом — окно открывает базу именно здесь.
          $home_dir = Join-Path $env:RUNNER_TEMP "rfid-home"
          $subject = Join-Path $home_dir "tables\Предмет"
          New-Item -ItemType Directory -Force $subject | Out-Null
          python -c "import sys; from pathlib import Path; from tests.helpers import make_roster_file; make_roster_file(Path(sys.argv[1]) / 'group.xlsx')" $subject
          Push-Location $env:RUNNER_TEMP
          $code = Run-For $home_dir
          if ($null -ne $code) { throw "RFID-Scanner.exe закрылся в своей папке (код $code)" }
          if (-not (Test-Path (Join-Path $home_dir "data\attendance.db"))) {
            throw "RFID-Scanner.exe не открыл базу в своей папке"
          }

          # Чужая папка: exe спрашивает папку. Без экрана вопрос сразу
          # возвращается как «отменено», и exe выходит с отказом (код 1) —
          # или ждёт, если вопрос всё же показан. Главное: здесь ничего
          # не создано, и он не «открылся» успешно с пустой базой.
          $stranger = Join-Path $env:RUNNER_TEMP "stranger"
          New-Item -ItemType Directory -Force $stranger | Out-Null
          $code = Run-For $stranger
          if ($code -eq 0) { throw "RFID-Scanner.exe открылся в чужой папке без выбора" }
          if (Test-Path (Join-Path $stranger "data")) { throw "RFID-Scanner.exe завёл data в чужой папке" }
          if (Test-Path (Join-Path $stranger "tables")) { throw "RFID-Scanner.exe завёл tables в чужой папке" }
          Pop-Location
          exit 0

      # Пустых data\ и tables\ в комплекте нарочно нет: распакованный
      # в новое место, exe принял бы их за рабочую папку и завёл бы там
      # пустую базу мимо настоящей. Без них он ищет папку или спрашивает её.
      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/RFID-Scanner.exe package/
          Copy-Item WINDOWS-README.txt package/README.txt

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: RFID-Scanner-Windows
          path: package/
          if-no-files-found: error
          retention-days: 30
