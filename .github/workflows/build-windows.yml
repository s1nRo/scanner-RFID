name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/gui
      - "codex/**"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[gui,dev]" pyinstaller

      - name: Run tests
        run: python -m pytest

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name RFID-Scanner `
            --collect-all openpyxl `
            windows_launcher.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: RFID-Scanner-Windows
          path: dist/RFID-Scanner.exe
          if-no-files-found: error
          retention-days: 30
