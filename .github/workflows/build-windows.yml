name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/gui
      - "codex/**"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[gui,dev]"

      - name: Run tests
        run: python -m pytest

      # Тот же скрипт, что и при локальной сборке, — чтобы exe из CI
      # и собранный руками не расходились.
      - name: Build executables
        shell: cmd
        env:
          BUILD_PY: python
        run: build-exe.cmd

      # exe обязан работать с data\ и tables\ рядом с собой, а в чужой
      # папке — спросить папку, а не завести пустую базу. Окно без экрана
      # (offscreen): смотрим, что процесс жив и какие файлы он создал.
      - name: Smoke-test RFID-Scanner.exe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = (Resolve-Path dist\RFID-Scanner.exe).Path
          # Запустить на 15 с. Вернуть $null, если ещё работает, иначе код выхода.
          function Run-For([string]$folder) {
            Copy-Item $exe $folder
            $p = Start-Process (Join-Path $folder "RFID-Scanner.exe") -PassThru
            Start-Sleep 15
            if (-not $p.HasExited) {
              taskkill /F /T /PID $p.Id | Out-Null
              return $null
            }
            return $p.ExitCode
          }

          # Своя папка: список группы рядом — окно открывает базу именно здесь.
          $home_dir = Join-Path $env:RUNNER_TEMP "rfid-home"
          $subject = Join-Path $home_dir "tables\Предмет"
          New-Item -ItemType Directory -Force $subject | Out-Null
          python -c "import sys; from pathlib import Path; from tests.helpers import make_roster_file; make_roster_file(Path(sys.argv[1]) / 'group.xlsx')" $subject
          Push-Location $env:RUNNER_TEMP
          $code = Run-For $home_dir
          if ($null -ne $code) { throw "RFID-Scanner.exe закрылся в своей папке (код $code)" }
          if (-not (Test-Path (Join-Path $home_dir "data\attendance.db"))) {
            throw "RFID-Scanner.exe не открыл базу в своей папке"
          }

          # Чужая папка: exe спрашивает папку. Без экрана вопрос сразу
          # возвращается как «отменено», и exe выходит с отказом (код 1) —
          # или ждёт, если вопрос всё же показан. Главное: здесь ничего
          # не создано, и он не «открылся» успешно с пустой базой.
          $stranger = Join-Path $env:RUNNER_TEMP "stranger"
          New-Item -ItemType Directory -Force $stranger | Out-Null
          $code = Run-For $stranger
          if ($code -eq 0) { throw "RFID-Scanner.exe открылся в чужой папке без выбора" }
          if (Test-Path (Join-Path $stranger "data")) { throw "RFID-Scanner.exe завёл data в чужой папке" }
          if (Test-Path (Join-Path $stranger "tables")) { throw "RFID-Scanner.exe завёл tables в чужой папке" }
          Pop-Location
          exit 0

      # Портабельная сборка (флешка) везёт с собой драйвер. В репозитории
      # его нет (driver/ в .gitignore), берём из ассета релиза.
      - name: Download driver package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DRIVER_RELEASE: v1.2.0
        run: |
          gh release download $env:DRIVER_RELEASE -R $env:GITHUB_REPOSITORY `
            -p "ironlogic-driver-*.zip" -D "$env:RUNNER_TEMP\drv-zip"
          $zip = Get-ChildItem "$env:RUNNER_TEMP\drv-zip\*.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\drv" -Force
          $inf = Get-ChildItem "$env:RUNNER_TEMP\drv" -Recurse -Filter ftdibus.inf |
            Select-Object -First 1
          if (-not $inf) { throw "в архиве драйвера нет ftdibus.inf" }
          "DRIVER_DIR=$($inf.DirectoryName)" >> $env:GITHUB_ENV

      # Вызовы SetupAPI через ctypes: Windows видит в пакете обе нужные
      # модели, перечисление устройств не падает. Считывателя на раннере
      # нет, саму установку проверить здесь нельзя.
      - name: Check driver package with SetupAPI
        shell: pwsh
        run: |
          python -c "import os, sys; from pathlib import Path; from rfid.scanner import driver as d; problems = d.check_package(Path(os.environ['DRIVER_DIR'])); print(problems or 'models ok'); print(d.WindowsBackend().reader_nodes()); sys.exit(1 if problems else 0)"
          if ($LASTEXITCODE -ne 0) { throw "пакет драйвера не принят SetupAPI ($LASTEXITCODE)" }

      - name: Build portable folder
        shell: cmd
        run: build-portable.cmd

      # С флешки: метка portable.txt рядом — рабочая папка своя, даже пустая.
      - name: Smoke-test portable folder
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $flash = Join-Path $env:RUNNER_TEMP "flash\RFID"
          New-Item -ItemType Directory -Force (Split-Path $flash) | Out-Null
          Copy-Item dist\RFID-Portable $flash -Recurse
          # База открывается, когда есть предмет: без списка её и не будет.
          $subject = Join-Path $flash "tables\Предмет"
          New-Item -ItemType Directory -Force $subject | Out-Null
          python -c "import sys; from pathlib import Path; from tests.helpers import make_roster_file; make_roster_file(Path(sys.argv[1]) / 'group.xlsx')" $subject
          Push-Location $env:RUNNER_TEMP
          $p = Start-Process (Join-Path $flash "RFID-Scanner.exe") -PassThru
          Start-Sleep 15
          $alive = -not $p.HasExited
          if ($alive) { taskkill /F /T /PID $p.Id | Out-Null }
          Pop-Location
          if (-not $alive) { throw "RFID-Scanner.exe с флешки закрылся (код $($p.ExitCode))" }
          if (-not (Test-Path (Join-Path $flash "data\attendance.db"))) {
            throw "портабельный exe не открыл базу рядом с собой"
          }
          if (-not (Test-Path (Join-Path $flash "driver\*\ftdiport.inf"))) {
            throw "в портабельной папке нет драйвера"
          }
          exit 0

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: RFID-Scanner-Portable
          path: dist/RFID-Portable/
          if-no-files-found: error
          retention-days: 30

      # Пустых data\ и tables\ в комплекте нарочно нет: распакованный
      # в новое место, exe принял бы их за рабочую папку и завёл бы там
      # пустую базу мимо настоящей. Без них он ищет папку или спрашивает её.
      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/RFID-Scanner.exe package/
          Copy-Item WINDOWS-README.txt package/README.txt

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: RFID-Scanner-Windows
          path: package/
          if-no-files-found: error
          retention-days: 30
